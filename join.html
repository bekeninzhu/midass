<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join - Skill Swap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Skill Swap</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Offers</a></li>
            <li class="nav-item"><a class="nav-link" href="join.html">Join</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="page">
      <div class="container">
        <h1>Join Skill Swap</h1>
        <div class="row g-4">
          <div class="col-lg-6">
            <h2>Meeting schedule</h2>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr><th>Day</th><th>Time</th><th>Place</th><th>Topic</th></tr>
                </thead>
                <tbody>
                  <tr><td>Monday</td><td>17:00</td><td>Library</td><td>Design</td></tr>
                  <tr><td>Wednesday</td><td>18:00</td><td>Coworking</td><td>Languages</td></tr>
                  <tr><td>Friday</td><td>16:00</td><td>Library</td><td>Programming</td></tr>
                  <tr><td>Saturday</td><td>12:00</td><td>Campus yard</td><td>Music</td></tr>
                </tbody>
                <tfoot>
                  <tr><td colspan="4">Total: 4 meetings a week</td></tr>
                </tfoot>
              </table>
            </div>
          </div>
          <div class="col-lg-6">
            <h2>Your offer</h2>
            <form class="form-box">
              <label for="name">Full name</label>
              <input type="text" id="name" class="form-control" required>

              <label for="email">Email</label>
              <input type="email" id="email" class="form-control" required>

              <label for="teach">I can teach</label>
              <input type="text" id="teach" class="form-control" required>

              <label for="learn">I want to learn</label>
              <input type="text" id="learn" class="form-control" required>

              <label>My level</label>
              <div class="levels">
                <label><input type="radio" name="level" value="beginner" checked> Beginner</label>
                <label><input type="radio" name="level" value="middle"> Middle</label>
                <label><input type="radio" name="level" value="advanced"> Advanced</label>
              </div>

              <label class="check"><input type="checkbox" required> I agree to meet on campus</label>

              <button type="submit" class="btn btn-main">Join</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>Skill Swap, student project for Web Technologies 1.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
